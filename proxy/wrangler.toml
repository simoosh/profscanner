name = "profscanner-relay"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# Origins allowed to use the relay (these are the live instance: replace with YOUR app's address).
# Demo mode stays OFF while this is "*".
ALLOWED_ORIGINS = "https://profscanner.netlify.app,http://localhost:5173"

# Upstream hosts for the CORS relay (defaults to NVIDIA, Z.ai, BigModel, GitHub Models, SambaNova).
# ALLOWED_HOSTS = "integrate.api.nvidia.com,api.z.ai"
# Custom models that must go through the relay need their host here (comma-separated, exact hosts).

# ── Demo mode (optional) ─────────────────────────────────────────────
# Enable it by setting the key as a secret:  npx wrangler secret put DEMO_API_KEY
# Default upstream is NVIDIA NIM; any OpenAI-compatible chat completions URL works.
# DEMO_UPSTREAM_URL = "https://integrate.api.nvidia.com/v1/chat/completions"
DEMO_MODELS = "z-ai/glm-5.3-flash"
DEMO_PER_IP_PER_DAY = "10"
DEMO_GLOBAL_PER_DAY = "300"
DEMO_MAX_PER_MINUTE = "30"
DEMO_MAX_TOKENS = "16384"
DEMO_MAX_BODY_BYTES = "8000000"

# Quota counters (Durable Object, available on the Workers Free plan).
[[durable_objects.bindings]]
name = "DEMO_QUOTA"
class_name = "DemoQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DemoQuota"]
